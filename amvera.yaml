meta:
  environment: python
  toolchain:
    name: pip
    version: 3.12

run:
  command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py create_admin && gunicorn gameshop.wsgi:application --bind 0.0.0.0:80"
  containerPort: 80
  persistenceMount: /data